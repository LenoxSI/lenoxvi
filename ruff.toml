# Python lint gate (issue #62) — dev-only tool, pinned in requirements-dev.txt.
# Conservative by law: the default rule set (pyflakes F + pycodestyle errors
# E4/E7/E9) and nothing else. The gate is bare `ruff check .`; dashboard-ui is
# oxlint's domain, not ruff's.

target-version = "py313"
extend-exclude = [".venv", "dashboard-ui"]

[lint]
select = ["E4", "E7", "E9", "F"]
